version: '3.8'

services:
  retispec-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retispec_server
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=4
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

